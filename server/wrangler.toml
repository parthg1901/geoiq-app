# Geonaut multiplayer server → https://play.geoiq.workers.dev
name = "play"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "CHALLENGES"
class_name = "ChallengeStore"

[[durable_objects.bindings]]
name = "VAULTS"
class_name = "SyncVault"

[[durable_objects.bindings]]
name = "PLAYERS"
class_name = "PlayerStore"

# SQLite-backed Durable Objects (available on the Workers free plan)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "ChallengeStore"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SyncVault", "PlayerStore"]
